<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>PavlDen Family VPN — Happ</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: Canvas;
      color: CanvasText;
    }
    main {
      width: min(520px, calc(100% - 40px));
      text-align: center;
      padding: 40px 0;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 1.55rem;
    }
    p {
      line-height: 1.55;
    }
    .button {
      display: inline-block;
      margin-top: 14px;
      padding: 14px 22px;
      border-radius: 12px;
      background: CanvasText;
      color: Canvas;
      text-decoration: none;
      font-weight: 700;
    }
    .note {
      margin-top: 24px;
      font-size: .92rem;
      opacity: .75;
    }
  </style>
</head>
<body>
  <main>
    <h1>🌐 PavlDen Family VPN</h1>

    <p id="status">Открываем вашу подписку в Happ…</p>

    <section id="fallback" hidden>
      <p>Если Happ не открылся автоматически, нажмите кнопку ниже.</p>
      <a id="open-happ" class="button" href="#">📲 Открыть Happ</a>
      <p class="note">Для продолжения приложение Happ должно быть установлено на устройстве.</p>
    </section>

    <section id="error" hidden>
      <p>⚠️ Не удалось получить ссылку подписки.</p>
      <p>Откройте PavlDen Family Bot и попробуйте снова.</p>
    </section>
  </main>

  <script>
    (() => {
      const status = document.getElementById("status");
      const fallback = document.getElementById("fallback");
      const error = document.getElementById("error");
      const button = document.getElementById("open-happ");

      function fail() {
        status.hidden = true;
        fallback.hidden = true;
        error.hidden = false;
      }

      function decodeBase64Url(value) {
        const base64 = value.replace(/-/g, "+").replace(/_/g, "/");
        const padded = base64 + "=".repeat((4 - (base64.length % 4)) % 4);
        const binary = atob(padded);
        const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      try {
        const payload = location.hash.slice(1);

        if (!payload) {
          fail();
          return;
        }

        const subscriptionUrl = decodeBase64Url(payload);

        if (!subscriptionUrl.startsWith("https://")) {
          fail();
          return;
        }

        // Remove the personal payload from the visible URL before opening Happ.
        history.replaceState(null, "", location.pathname + location.search);

        const happUrl = "happ://add/" + subscriptionUrl;

        button.href = happUrl;
        fallback.hidden = false;

        // Try automatic hand-off first; the visible button is the fallback.
        window.location.href = happUrl;
      } catch (_) {
        fail();
      }
    })();
  </script>
</body>
</html>
