<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>PavlDen Family VPN</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10152d;color:#fff}
    main{width:min(640px,calc(100% - 36px));padding:34px 0}
    .card{background:#1a2148;border:1px solid #2d376d;border-radius:22px;padding:28px;box-shadow:0 18px 50px #0005}
    h1{margin:0 0 12px;font-size:2rem}
    p{line-height:1.6;color:#d7dcf3}
    .actions{display:grid;gap:12px;margin-top:24px}
    a{display:block;padding:15px 18px;border-radius:13px;text-decoration:none;font-weight:700;text-align:center}
    .primary{background:#fff;color:#152044}
    .secondary{border:1px solid #6e7bd0;color:#fff}
    small{display:block;margin-top:24px;color:#939cc7;text-align:center}
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>🌐 PavlDen Family VPN</h1>
      <p>Инструкции по подключению и настройке семейной VPN-подписки.</p>
      <div class="actions">
        <a class="primary" href="./android/">📱 Android — Happ</a>
        <a class="secondary" href="https://t.me/pavlden_family_bot">🤖 Открыть Telegram-бот</a>
      </div>
      <small>Персональные ссылки подписок и QR-коды не публикуйте.</small>
    </div>
  </main>
</body>
</html>
